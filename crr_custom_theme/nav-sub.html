{% set blurlist = config.extra.nav_blur_terms.split(';') %}
{%- if not nav_item.children %}
<li>
    <a href="{{ nav_item.url|url }}" class="{% if nav_item.title in blurlist %}iBLURREDi {% endif %}dropdown-item{% if nav_item.active %} active" aria-current="page{% endif %}">{{ nav_item.title }}</a>
</li>
{%- else %}
<li class="dropdown-submenu">
    <a href="#" class="{% if nav_item.title in blurlist %}iBLURREDi {% endif %}dropdown-item">{{ nav_item.title }}</a>
    <ul class="dropdown-menu">
        {%- for nav_item in nav_item.children %}
        {% include "nav-sub.html" %}
        {%- endfor %}
    </ul>
</li>
{%- endif %}
