site_name: Control Resonant Reference
site_url: https://weslo-stem.github.io/control-resonant-reference/
repo_url: https://github.com/weslo-stem/control-resonant-reference
edit_uri: blob/main/docs/
extra_javascript:
    - path: scripts/muConnector.js
    - path: scripts/updateMultipliers.js
      type: module
    - https://jquery.com
    #- path: scripts/updateMultIcons.js
extra_css: 
    - stylesheets/extra.css
markdown_extensions:
  - md_in_html
plugins:
    - search
    - macros:
        on_undefined: keep
        icons: 'main/icons'
        gifs: 'main/gifs'
        pages: 'main/pages'
        images: 'main/images'
    - table-reader
    - placeholder
    - awesome-nav
    - toggle-sidebar:
        show_toc_by_default: False
        enable_key_bindings: False
theme:
  name: mkdocs
  custom_dir: 'crr_custom_theme/'
  favicon: 'docs/icons/favicon.ico'
extra:
  nav_blur_terms: Hedron;Unknown;Underpass;The Physicist;Astral Plane;The Co-Director;Evacuation Zone (Secret)
  ctx: /control-resonant-reference
  dmg_falter_formula: "`100% + ( Aberrant Strength * 1.67% )`"