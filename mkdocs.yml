site_name: Control Resonant Reference
site_url: https://weslo-stem.github.io/control-resonant-reference/
repo_url: https://github.com/weslo-stem/control-resonant-reference
edit_uri: edit/main/docs/
extra_css: 
    - stylesheets/extra.css
markdown_extensions:
  - md_in_html
plugins:
    - search
    - macros:
        on_undefined: keep
        icons: 'main/icons'
        gifs: 'main/gifs'
        pages: 'main/pages'
        images: 'main/images'
    - table-reader
    - placeholder
    - awesome-nav
    #- webcontext:
    #    context: control-resonant-reference
theme:
  name: mkdocs
  custom_dir: 'crr_custom_theme/'
  favicon: 'docs/icons/favicon.ico'
extra:
  nav_blur_terms: Hedron;Unknown;Underpass;The Physicist;Astral Plane;The Co-Director
  ctx: /control-resonant-reference