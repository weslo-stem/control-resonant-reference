settings:
    auto_placeholder_tables: false
    replace_delay_millis: -1
    debug_javascript: true

validators:
    cc_uint:
        name: "Charge Count"
        rules:
        - regex: "^[+-]?[0-5]{1}$"
          should_match: true
    sc_uint:
        name: "Summon Count"
        rules:
        - regex: "^[+-]?[0-5]{1}$"
          should_match: true